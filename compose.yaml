services:
  sonder:
    build: .
    image: sonder-audiobooks:local
    container_name: sonder
    restart: unless-stopped
    init: true
    # Ubuntu host networking reaches the existing VPN container's private RPC address.
    # The web server binds loopback and can be placed behind your HTTPS reverse proxy.
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${PORT:-3001}
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env before starting the server}
      MEDIA_ROOT: ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
      REQUIRE_MEDIA_MOUNT: "true"
      # Content-Security-Policy: report-only (default) logs violations without blocking; enforce blocks; off sends none.
      # Set CSP_MODE=enforce in .env once a few days of real use show no `csp violation:` lines in the log.
      CSP_MODE: ${CSP_MODE:-report-only}
    volumes:
      - ./data:/app/data
      # ssh key, config and known_hosts for the remote alignment pool (see docs/CTC_WORKER_POOL.md).
      - ./data/pool-ssh:/home/node/.ssh:ro
      - ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}:${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s
# Alignment runs only on the remote CTC pool hosts (ADR 0006, #279); this machine runs no alignment
# worker. worker/ holds the code those hosts run (scripts/install-ctc-workers.sh).
