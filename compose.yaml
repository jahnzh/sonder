services:
  sonder:
    build: .
    image: sonder-audiobooks:local
    container_name: sonder
    restart: unless-stopped
    init: true
    # Ubuntu host networking reaches the existing VPN container's private RPC address.
    # The web server binds loopback and can be placed behind your HTTPS reverse proxy.
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${PORT:-3001}
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env before starting the server}
      MEDIA_ROOT: ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
      REQUIRE_MEDIA_MOUNT: "true"
    volumes:
      - ./data:/app/data
      - ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}:${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s
  alignment-worker:
    build: ./worker
    image: sonder-alignment:local
    container_name: sonder-alignment
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:3012:3012"
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
      MEDIA_VOLUME_ID: ${MEDIA_VOLUME_ID:?Set the mounted media volume ID}
      ALIGNMENT_WORKER_TOKEN: ${ALIGNMENT_WORKER_TOKEN:?Generate a private worker token}
      HF_HOME: ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}/alignment/models/huggingface
      HF_HUB_DISABLE_XET: "1"
      # Alignment time limit: min(MAX, BASE + PER_AUDIO_SECOND x audio seconds). Empty uses the
      # defaults 120 s, 0.15 and 1200 s; see README. Set them in .env, not here.
      ALIGNMENT_TIMEOUT_BASE_SECONDS: ${ALIGNMENT_TIMEOUT_BASE_SECONDS:-}
      ALIGNMENT_TIMEOUT_PER_AUDIO_SECOND: ${ALIGNMENT_TIMEOUT_PER_AUDIO_SECOND:-}
      ALIGNMENT_TIMEOUT_MAX_SECONDS: ${ALIGNMENT_TIMEOUT_MAX_SECONDS:-}
    volumes:
      - ${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}:${MEDIA_ROOT:-/mnt/usb_4t_1/sonder}
    cpus: 2
    mem_limit: 6g
    read_only: true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3012/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
