<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request an account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#dd8966}a:hover{color:#f0a586}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: #101510; color: #e6eadf; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
<header style="height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between">
<a href="SignIn.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 8px; background: #26331f; color: #e6eadf; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</header>

<h1 style="margin: 0; flex: none; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 28px; line-height: 34px">Request an account</h1>
<p style="margin: -8px 0 0; flex: none; font-size: 14px; line-height: 20px; color: #a9b59d">The administrator reviews each request and sends an invite link by email.</p>

<form style="flex: none; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="request-email" style="font-size: 14px; line-height: 20px; font-weight: 500">Email</label>
<input id="request-email" type="email" autocomplete="email" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3c4934; border-radius: 8px; background: #101510; color: #e6eadf; font: 400 16px/22px 'DM Sans', sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="request-username" style="font-size: 14px; line-height: 20px; font-weight: 500">Username</label>
<input id="request-username" type="text" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3c4934; border-radius: 8px; background: #101510; color: #e6eadf; font: 400 16px/22px 'DM Sans', sans-serif">
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #a9b59d">Letters, numbers, dots, dashes or underscores.</p></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="request-note" style="font-size: 14px; line-height: 20px; font-weight: 500">Note <span style="font-weight: 400; color: #a9b59d">optional</span></label>
<textarea id="request-note" rows="3" style="width: 100%; height: 88px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3c4934; border-radius: 8px; background: #101510; color: #e6eadf; font: 400 16px/22px 'DM Sans', sans-serif; resize: none"></textarea>
</div>
</form>

<div style="margin-top: auto; flex: none"><button type="button" style="height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; flex: none; background: {{accent}}; color: #101510; font-weight: 600">Send request</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#dd8966","options":["#dd8966","#e0b060","#8fb8a0","#9db4e8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#dd8966' };
}
}
</script>
</body>
</html>
